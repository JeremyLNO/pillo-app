name: TestFlight Release

# Auto-publishes every push to main to TestFlight. Requires 5 repo secrets
# (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID              — App Store Connect API Key ID
#   ASC_ISSUER_ID           — App Store Connect API Issuer ID
#   ASC_KEY_P8              — full contents of the AuthKey_<id>.p8 file
#   IOS_DEV_CERT_P12        — base64 of an exported "Apple Development" .p12
#                             (a Distribution certificate will NOT do: see the
#                             certificate guard below)
#   IOS_DEV_CERT_PASSWORD   — the password that .p12 was exported with
# The API key comes from App Store Connect → Users and Access → Integrations
# → App Store Connect API (NOT an APNs key — different key, same portal
# family). xcodebuild archive with automatic signing needs a signing identity
# on the runner for the archive step itself — that's the cert imported into a
# throwaway keychain every run, reused instead of minting a brand new one each
# time (GitHub's runners are ephemeral; doing that repeatedly silently exhausts
# the account's certificate quota). The App Store submission itself is driven by
# the API key, during export/upload.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    if: ${{ vars.SKIP_TESTFLIGHT != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        # App Store Connect refuse un binaire construit avec une bêta :
        # « Unsupported SDK or Xcode version [...] you need to use the latest Release
        # Candidates (RC) ». L'image xcode-27 ne contient QU'UNE bêta (27A5252f),
        # exposée sous quatre noms — Xcode.app, Xcode_27.0.app, Xcode_27.0.0.app,
        # Xcode_27_beta_6.app — donc choisir « celui dont le nom ne dit pas beta »
        # retombe sur le même binaire. D'où l'inventaire par identifiant de build
        # ci-dessous, et non par nom de dossier : un alias ne trompe pas un build id.
        run: |
          set -euo pipefail
          echo "Xcode installés (chemin → build) :"
          for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            b=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || echo '?')
            echo "  $x → $b"
          done
          # Les identifiants de build des bêtas installées, pour écarter aussi leurs alias.
          betas=$(for x in $(ls -d /Applications/Xcode*beta*.app 2>/dev/null); do
                    /usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || true
                  done | sort -u)
          chosen=""
          for x in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V); do
            b=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$x/Contents/version.plist" 2>/dev/null || echo '?')
            if [ -n "$betas" ] && echo "$betas" | grep -qx "$b"; then continue; fi
            chosen="$x"
          done
          if [ -z "$chosen" ]; then
            echo "::error::Cette image ne contient que des Xcode bêta — App Store Connect refusera l'upload."
            exit 1
          fi
          echo "Retenu : $chosen"
          sudo xcode-select -s "$chosen"
          xcodebuild -version

      - name: Write App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          # Without this, xcodebuild's automatic signing does not see the
          # identity we just imported and quietly mints a BRAND NEW "Apple
          # Development" certificate on every run, which exhausts the
          # account-wide certificate quota after a handful of builds and then
          # breaks archiving for every app on the account.
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Fail loudly rather than let the build "succeed" on a certificate
          # xcodebuild created for itself. It has to be an "Apple Development"
          # identity specifically — that is what the archive step signs with, and a
          # Distribution-only keychain sends xcodebuild off to make its own.
          # Note the identity here is legitimately named "Apple Development:
          # Created via API": that is simply how a certificate issued through the
          # App Store Connect API is named, not evidence of one being minted per
          # run. Matching on that name to detect minting is a false positive
          # (run 33741030465) — the imported certificate carries it too.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep -q "Apple Development" || {
            echo "::error::IOS_DEV_CERT_P12 holds no \"Apple Development\" identity (a Distribution certificate alone is not enough — xcodebuild would mint a new development cert every run). Export one from Xcode ▸ Settings ▸ Accounts ▸ Manage Certificates and replace the secret."
            exit 1
          }

      - name: Resolve Swift packages
        # Résolu à part, avec son propre chrono. Une résolution qui se bloque
        # *dans* `xcodebuild archive` n'a aucun timeout à elle : le 2026-09-14,
        # trois dépôts sont restés figés juste après « Checking out 5.5.1 of
        # package OneSignal-XCFramework » et GitHub ne les a tués qu'au bout de
        # SIX heures. Ici, ça échoue en 10 minutes et ça se voit.
        timeout-minutes: 10
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Pillo.xcodeproj \
            -scheme Pillo

      - name: Archive (signed, automatic provisioning)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          archive() {
          # Numéro de build : minutes écoulées depuis le 2023-11-14. Strictement
          # croissant (~525 000/an) et identique à celui qu'utilise un upload manuel
          # depuis le Mac, donc les deux chemins ne se croiseront jamais.
          # `github.run_number` ne tenait pas cette promesse : il repart de son propre
          # compteur et se fait dépasser par le premier upload manuel, après quoi la CI
          # ne peut plus rien publier.
          BUILD_NUMBER=$(( ($(date +%s) - 1700000000) / 60 ))
            xcodebuild archive \
              -project Pillo.xcodeproj \
              -scheme Pillo \
              -disableAutomaticPackageResolution \
              -configuration Release \
              -archivePath build/Pillo.xcarchive \
              -destination 'generic/platform=iOS' \
              -allowProvisioningUpdates \
              CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          # First run downloads/creates any missing provisioning profiles (esp.
          # for the watch targets) — occasionally the build plan is computed
          # just before that download lands on disk, failing with "Build input
          # file cannot be found: .../<uuid>.mobileprovision". A second attempt
          # always finds the file already there and succeeds.
          archive || { echo "Retrying archive (profile likely just landed)…"; archive; }

      - name: Export & upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Pillo.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
